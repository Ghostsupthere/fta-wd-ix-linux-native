name: Build or code issue
description: A build failure, a bug found in the source, or a question about the code
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is the source code, Linux x86-64 only. If you are trying to **play** the client, please use the
        [installer repository](https://github.com/Ghostsupthere/fta-linux-client/issues/new/choose) instead.
        Feature status is tracked in [docs/WXL-NATIVE-PORT.md](https://github.com/Ghostsupthere/fta-wd-ix-linux-native/blob/main/docs/WXL-NATIVE-PORT.md).
  - type: textarea
    id: what
    attributes:
      label: What is wrong?
      description: "The error, the file and function if you know them, and what you expected."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: "The commands you ran (for a build problem, from `nix-shell shell-native.nix` onward) and the last lines of the output."
      render: shell
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "Output of `git rev-parse --short HEAD`"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Linux distribution and Nix version
      placeholder: "e.g. CachyOS, nix 2.31"
    validations:
      required: true
